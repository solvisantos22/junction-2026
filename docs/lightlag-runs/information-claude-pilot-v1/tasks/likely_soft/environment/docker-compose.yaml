services:
  main:
    depends_on:
      information:
        condition: service_healthy
  information:
    build:
      context: ./simulator
    expose:
      - "8000"
    environment:
      INFORMATION_SEED: "304027283907636818682655233611370503465"
      INFORMATION_CONTEXT: "likely_soft"
      INFORMATION_ARTIFACT_DIR: /evaluator
      INFORMATION_TOKEN_FILE: /run/information/token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
