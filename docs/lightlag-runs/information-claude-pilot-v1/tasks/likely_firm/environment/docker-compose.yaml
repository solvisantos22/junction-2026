services:
  main:
    depends_on:
      information:
        condition: service_healthy
  information:
    build:
      context: ./simulator
    expose:
      - "8000"
    environment:
      INFORMATION_SEED: "263943279142217370445448506041974237524"
      INFORMATION_CONTEXT: "likely_firm"
      INFORMATION_ARTIFACT_DIR: /evaluator
      INFORMATION_TOKEN_FILE: /run/information/token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
