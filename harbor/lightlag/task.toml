schema_version = "1.4"

# The simulator's result directory. Harbor copies it out of the simulator's
# container after the agent's container has stopped, and into the verifier's.
# The agent's container never holds it.
artifacts = [{ source = "/evaluator", service = "lightlag" }]

[task]
name = "neural-network-november/lightlag"
version = "0.1.0"
description = "Drive a rover through a signal delay: commands land late, telemetry is old, and wheel slip has to be learned by driving."
authors = []
keywords = ["rl-environment", "signal-delay", "control", "partial-observability", "mcp"]

[metadata]

[verifier]
timeout_sec = 120.0
# A fresh container the agent never touched reads the simulator's own result.
environment_mode = "separate"

# Runs inside the simulator's container once the agent's container is stopped:
# closes the episode, lets the remaining ticks pass and writes the grade.
[[verifier.collect]]
service = "lightlag"
command = "python -m lightlag_mcp.finish --url http://127.0.0.1:8000 --token-file /run/lightlag/token"
timeout_sec = 60.0

[verifier.env]

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "public"
build_timeout_sec = 900.0
os = "linux"

[[environment.mcp_servers]]
name = "lightlag"
transport = "streamable-http"
url = "http://lightlag:8000/mcp"

[environment.env]

[solution.env]
