<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightlag Traverse</title>
<!--DEV-->
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports": {"three": "../mars/vendor/three.module.js"}}</script>
<script type="module">
  window.LIGHTLAG_TRAVERSE = await (await fetch("data.json")).json();
  await import("./app.js");
</script>
<!--/DEV-->
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <header id="bar">
    <div id="brand"><b>LIGHTLAG</b><span class="brand2">TRAVERSE</span></div>
    <button id="play" title="Play / pause (space)">▶</button>
    <div class="timeline"><canvas id="marks"></canvas><input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Time"></div>
    <div id="clock"><b>0</b><span></span></div>
    <div id="day" title="The sun over the mission: it rises in the east, on the right"><canvas id="sun"></canvas><b></b><span></span></div>
    <button id="speed" title="Playback speed (- and =)">1×</button>
    <button id="cam" title="Switch camera (C)">CHASE</button>
  </header>
  <main id="stage">
    <div id="tag"></div>
    <div id="feed"></div>
    <canvas id="mini"></canvas>
    <div id="power"></div>
    <div id="legend"></div>
    <div id="banner"></div>
  </main>
  <aside id="board"></aside>
</div>
<div id="title">
  <div class="in">
    <p class="kicker" id="kicker"></p>
    <h1>LIGHTLAG<span class="brand2">TRAVERSE</span></h1>
    <p class="tag" id="pitch"></p>
    <nav id="sites"></nav>
    <div class="go"><button id="playbtn">▶ Play</button><button id="storybtn" hidden>Story mode</button></div>
    <p class="help">Space play · Scroll zoom · Drag move · Tab next rover</p>
  </div>
</div>
</body>
</html>
